spring:
  application:
    name: mbti-ai-backend
  ai:
    # Spring AI stays disabled in the default offline mock mode.
    # Set AI_SPRING_MODEL_CHAT=openai with AI_PROVIDER=spring-ai to enable it.
    model:
      chat: ${AI_SPRING_MODEL_CHAT:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${AI_API_KEY:dummy}}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: ${AI_TEMPERATURE:0.7}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mbti_ai}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:mbti}
    password: ${DB_PASSWORD:mbti_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          time_zone: Asia/Shanghai
        order_inserts: true
        order_updates: true
  mvc:
    async:
      request-timeout: 5m
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketfactory:
            class: javax.net.ssl.SSLSocketFactory

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  tomcat:
    threads:
      max: 200
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    # 邮件未启用时不做连接探测，避免 /actuator/health 出现无关的 DOWN 细节
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:MyVerySecureSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  api:
    version: v1
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: 120
      refill-seconds: 60
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:20}
    mock-delay-millis: ${AI_MOCK_DELAY_MILLIS:0}
