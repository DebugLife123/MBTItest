# Test Configuration
spring.application.name=mbti-ai-backend-test
server.port=0

# H2 in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:mbti_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway remains disabled in tests; Hibernate owns the disposable test schema.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Prevent Spring Data Redis from scanning JPA repositories.
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false

logging.level.root=WARN
logging.level.com.debuglife=INFO
